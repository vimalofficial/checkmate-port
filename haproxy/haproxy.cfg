global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend next_frontend
    bind :80
    default_backend next_servers

backend next_servers
    balance roundrobin
    option httpchk GET /
    server app1 192.168.58.128:3000 check
    server app2 192.168.58.129:3000 check
